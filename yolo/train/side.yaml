# 앞(front)·뒤(back) 카메라 모델 학습 설정 — YOLO11n, 두 카메라가 같은 모델을 씀
# 클래스 순서·이름: 팀 라벨링 classes.txt 그대로 (11/19 확정). 라벨링을 시작했으므로 순서·이름을 바꾸지 않는다.
#
# 박스 그리는 법
#   - 건전지 몸통 전체에 박스 1개: object (극 방향 구분 없음 — 극 방향은 위 카메라·전압 측정에서 확인)
#   - 불량 부위에 박스 따로: scratch / damage / corrosion (한 건전지에 여러 개 가능)
#   - 정상 건전지: object 1개 / 불량 건전지: object 1개 + 불량 박스 여러 개
#   - 배경·다른 물체 사진(파일 이름 sticker_…)은 박스 없이 저장 (음성 샘플)
#
# 학습 도구(YOLO11n 학습 도구)로 학습하면 data.yaml을 도구가 만들므로 이 파일은 이름·순서 기준표로 쓴다.
# 명령으로 학습할 때:  yolo detect train data=train\side.yaml model=yolo11n.pt imgsz=640 epochs=100
# 결과:  best.pt → models\side_best.pt, yolo_vision.py CAMERAS의 front·back model에 같은 파일

path: C:/depal/yolo_data/side     # 학습 PC에 맞게 바꾸기
train: images/train
val: images/val

names:
  0: object      # 건전지 몸통 (정상·불량 모두)
  1: scratch     # 긁힘
  2: damage      # 손상
  3: corrosion   # 부식
