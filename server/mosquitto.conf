# Mosquitto 설정 (서버 PC용)
# 실행: "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v

# 1883번 포트에서 접속 받기 (로봇팔 1·다른 PC의 관리자 화면 등도 접속 가능)
listener 1883
# 시험 기간에는 비밀번호 없이 허용 (라인 완성 후 계정 설정 예정)
allow_anonymous true

# ---- 메시지 보관 (DB 저장 프로그램이 꺼져 있던 동안의 메시지 유지) ----
# 브로커를 껐다 켜도 보관 중인 메시지와 세션을 디스크에 남김
persistence true
# 보관 파일 위치: 실행한 폴더(server\) 기준 data 폴더. 끝에 / 필요
# start_*.bat가 server 폴더로 이동한 뒤 브로커를 켜므로, 폴더를 어디로 옮겨도 동작함
persistence_location data/
# 30초마다 디스크에 저장 (기본값은 30분)
autosave_interval 30
# 구독자 하나당 보관할 최대 메시지 수 (기본 1000 → 넉넉하게)
max_queued_messages 10000
