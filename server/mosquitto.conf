# Mosquitto 설정 (서버 PC용, Mosquitto 2.1)
# 실행: start_all.bat (run_all.py가 서버 폴더에서 브로커를 켬)
#   손으로 켤 때는 먼저 서버 폴더로 이동한 뒤:  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
# 이 파일의 passwd·acl_web.txt·data/ 는 상대 경로 = 브로커를 켠 폴더(서버 폴더) 기준.
#   서버 폴더가 C:\depal\server가 아니어도(바탕화면 등) 그대로 동작한다

# ---- 계정·ACL 플러그인 (9001 홈페이지 포트에서만 사용, 주문 통신 규약 1-2) ----
plugin_load pwfile C:\Program Files\mosquitto\mosquitto_password_file.dll
plugin_opt_password_file passwd
plugin_load aclfile C:\Program Files\mosquitto\mosquitto_acl_file.dll
plugin_opt_acl_file acl_web.txt

# 1883번 포트: 장치·관리자 프로그램 (지금처럼 비밀번호 없이)
listener 1883
listener_allow_anonymous true

# 9001번 포트: 홈페이지 (WebSocket, 계정 web만, ACL 적용)
listener 9001
protocol websockets
listener_allow_anonymous false
plugin_use pwfile
plugin_use aclfile

# ---- 메시지 보관 (DB 저장 프로그램이 꺼져 있던 동안의 메시지 유지) ----
# 브로커를 껐다 켜도 보관 중인 메시지와 세션을 디스크에 남김
persistence true
# 보관 파일 위치: 실행한 폴더(server\) 기준 data 폴더. 끝에 / 필요
persistence_location data/
# 30초마다 디스크에 저장 (기본값은 30분)
autosave_interval 30
# 구독자 하나당 보관할 최대 메시지 수 (기본 1000 → 넉넉하게)
max_queued_messages 10000